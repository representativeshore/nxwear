name: Braslet

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Braslet:
    type: application
    platform: iOS
    sources:
      - path: Braslet
    dependencies:
      - target: BrasletWidgetExtension
        embed: true
    entitlements:
      path: Braslet/Braslet.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.example.braslet]
    # Info.plist задаём явно: часть ключей (фоновый режим, файловый доступ)
    # через настройки сборки не проходит и молча теряется.
    info:
      path: Braslet/Info.plist
      properties:
        CFBundleDisplayName: Мобильный
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [bluetooth-central, location, audio, voip]
        NSLocationWhenInUseUsageDescription: Чтобы записывать маршрут тренировки — своего GPS у браслета нет.
        NSLocationAlwaysAndWhenInUseUsageDescription: Чтобы трек не обрывался, когда экран гаснет.
        NSBluetoothAlwaysUsageDescription: Чтобы читать данные прямо с браслета.
        NSHealthUpdateUsageDescription: Чтобы переносить данные с браслета в «Здоровье».
        NSHealthShareUsageDescription: Чтобы не записывать одно и то же дважды.
        NSMicrophoneUsageDescription: Для диктофона и записи видео по жесту встряхивания.
        NSCameraUsageDescription: Для камеры-затвора — снимать по жесту встряхивания.
        NSPhotoLibraryAddUsageDescription: Чтобы сохранять снятые фото и видео.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.braslet
        PRODUCT_NAME: Braslet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Бесплатная учётка Apple ID: приложение живёт на телефоне 7 дней,
        # потом просто пересобрать этой же командой.
        DEVELOPMENT_TEAM: W5B65FK4NQ
        TARGETED_DEVICE_FAMILY: "1"

  BrasletWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BrasletWidget
      - path: Braslet/Core/WidgetSnapshot.swift
      - path: Braslet/Core/WornShared.swift
    entitlements:
      path: BrasletWidget/BrasletWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.braslet]
    info:
      path: BrasletWidget/Info.plist
      properties:
        CFBundleDisplayName: Браслет
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.braslet.widget
        PRODUCT_NAME: BrasletWidget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5B65FK4NQ
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
